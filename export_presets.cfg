ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="Expand-Archive -LiteralPath '{temp_dir}\\{archive_name}' -DestinationPath '{temp_dir}'\nPop-Location\nInvoke-Command -ScriptBlock {{ Start-Process -Verb RunAs -FilePath \"{temp_dir}\\{exe_name}\" }} -ComputerName {host} -Verbose\n"
ssh_remote_deploy/cleanup_script="Invoke-Command -ScriptBlock {{ Stop-Process -Name \"{exe_name}\" }} -ComputerName {host} -Verbose\n$startTime = Get-Date\nDo {{\n  Wait 2\n  $status = Invoke-Command -ScriptBlock {{ Get-Process -Name \"{exe_name}\" }} -ComputerName {host} 2>&1\n  $elapsedTime = $(get-date) - $startTime\n}} until ($status -match \"Cannot find a process\" -or $elapsedTime.TotalSeconds -gt 10)\nInvoke-Command -ScriptBlock {{ Remove-Item -Recurse -Force \"{temp_dir}\" }} -ComputerName {host} -Verbose\n"
